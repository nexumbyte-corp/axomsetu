name: CI (Continuous Integration)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-ci:
    name: Client - Lint & Production Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Oxlint Code Quality Check
        run: npm run lint

      - name: Verify Client Production Build
        run: npm run build

  server-ci:
    name: Server - Schema Validation & Migration Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    env:
      DATABASE_URL: "postgresql://postgres:root@localhost:5432/school_saas?schema=public"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: school_saas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Run Server Syntax Check
        run: npm run lint

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Strip BOM from Migration SQL Files
        run: find prisma/migrations -name "*.sql" -exec sed -i '1s/^\xef\xbb\xbf//' {} +

      - name: Test Database Migrations (Isolated DB Container)
        run: npx prisma migrate deploy
